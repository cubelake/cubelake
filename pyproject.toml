[project]
name = "appstore-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pycountry>=26.2.16",
    "pydantic>=2.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apple_rss*", "apple_itunes*", "common*"]

[tool.setuptools.package-data]
"apple_rss.data_schema" = ["*.json"]
