# Airflow runtime for the cubelake services. Run from this directory:
#   just init   (first time: generates secrets, builds service images, migrates DB)
#   just up
# Airflow only orchestrates: every task runs a service image (services/*/Dockerfile) through
# the Docker socket proxy. Each service mounts its own DAG folder read-only.

x-airflow-common:
  &airflow-common
  image: apache/airflow:${AIRFLOW_VERSION:-3.3.2}-python3.13
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?run `just secrets`}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run `just secrets`}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?run `just secrets`}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run `just secrets`}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    DOCKER_HOST: tcp://docker-proxy:2375
  volumes:
    - ../../services/apple-rss/dags:/opt/airflow/dags/apple_rss:ro
    - ../../services/apple-itunes/dags:/opt/airflow/dags/apple_itunes:ro
    - ../../services/appstore-analytics/dags:/opt/airflow/dags/appstore_analytics:ro
    - airflow-logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    docker-proxy:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `just secrets`}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    # no published ports: only reachable from the compose network
    restart: always

  # Airflow never gets the raw Docker socket; only the container/image API it needs.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"  # localhost only; on the server use an SSH/IAP tunnel
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "chown -R 50000:0 /opt/airflow/logs && /entrypoint airflow version"]
    user: "0:0"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run `just secrets`}

  # Local dev only: the shared lake volume is written by service containers running as uid 10001.
  lake-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 10001:10001 /lake"]
    volumes:
      - lake:/lake
    profiles: ["local-lake"]

  # Service images (built locally; in production they come from Artifact Registry).
  apple-rss:
    build: ../../services/apple-rss
    image: apple-rss:local
    profiles: ["images"]
  apple-itunes:
    build: ../../services/apple-itunes
    image: apple-itunes:local
    profiles: ["images"]
  appstore-analytics:
    build: ../../services/appstore-analytics
    image: appstore-analytics:local
    profiles: ["images"]

volumes:
  postgres-db-volume:
  airflow-logs:
  lake:
    name: cubelake-lake  # fixed name: DockerOperator mounts it by this name
